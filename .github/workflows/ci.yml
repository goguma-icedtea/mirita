name: Verify Mirita
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run cf:dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:local
      - name: Browser flow against Workers
        run: |
          npm start > /tmp/mirita-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run test:browser
      - name: Upload UI verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirita-ui-checks
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
