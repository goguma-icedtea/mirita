name: Verify Mirita
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser flow
        run: |
          npm start > /tmp/mirita-server.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && break || sleep 1; done
          node test/browser.cjs
